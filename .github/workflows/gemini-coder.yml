name: Gemini Auto Coder

on:
  issues:
    types: [opened, edited]

jobs:
  generate-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate Code with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'EOF' > generate.py
          import os
          import re
          import glob
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          client = genai.Client(api_key=api_key)

          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")

          # リポジトリ内の主要な既存ファイルをコンテキストとして収集
          existing_files_summary = ""
          target_extensions = ['*.html', '*.js', '*.css', '*.py', '*.json']
          for ext in target_extensions:
              for filepath in glob.glob(f'./**/{ext}', recursive=True):
                  if 'node_modules' in filepath or '.git' in filepath:
                      continue
                  try:
                      with open(filepath, 'r', encoding='utf-8') as f:
                          content = f.read()
                          existing_files_summary += f"\n--- File: {filepath} ---\n{content}\n"
                  except Exception as e:
                      pass

          prompt = f"""
          あなたは優秀なWeb開発AIです。以下のIssue指示に従ってコードを作成または改修してください。

          【Issueタイトル】
          {issue_title}

          【Issue本文】
          {issue_body}

          【既存のリポジトリ内ファイル一覧】
          {existing_files_summary}

          【指示事項】
          1. Issueの指示に最も該当するファイルが既存一覧にあれば、そのファイルを全件改修したコードを出力してください。
          2. 該当するファイルが存在しない場合、新しい適切なファイル名で新規作成してください。
          3. 出力フォーマットは必ず以下のように、1つのコードブロック内にファイル名を指定して出力してください。

          例（index.htmlを書き換える場合）:
          ```html:index.html
          <!DOCTYPE html>
          ...
          ```

          例（新規で app.js を作成する場合）:
          ```javascript:app.js
          console.log("hello");
          ```
          """

          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt,
          )

          text = response.text

          # コードブロックとファイル名の抽出 regex
          pattern = r"```(?:\w+:)?([^\n]+)\n(.*?)```"
          matches = re.findall(pattern, text, re.DOTALL)

          if matches:
              for filename, code in matches:
                  filename = filename.strip()
                  # ディレクトリが存在しない場合は作成
                  dir_name = os.path.dirname(filename)
                  if dir_name:
                      os.makedirs(dir_name, exist_ok=True)
                  
                  with open(filename, 'w', encoding='utf-8') as f:
                      f.write(code.strip())
                  print(f"Successfully written to {filename}")
          else:
              # フォールバック（ファイル名が抽出できなかった場合）
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(text)
              print("Saved as index.html (fallback)")
          EOF

          python generate.py

      - name: Create Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="fix/issue-${ISSUE_NUMBER}"
          git checkout -b $BRANCH_NAME || git checkout $BRANCH_NAME
          
          git add .
          git commit -m "auto: update/create code for Issue #${ISSUE_NUMBER} - ${ISSUE_TITLE}" || exit 0
          git push origin $BRANCH_NAME --force
          
          gh pr create \
            --title "Fix Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --body "Automated changes generated by Gemini for Issue #${ISSUE_NUMBER}." \
            --head $BRANCH_NAME \
            --base main || echo "PR already exists or created."
