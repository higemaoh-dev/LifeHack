name: Generate Code with Gemini

on:
  issues:
    types: [opened, edited]

jobs:
  generate-code:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate Code and Save
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'EOF' > generate_script.py
          import os
          import re
          from google import genai

          api_key = os.environ.get('GEMINI_API_KEY')
          client = genai.Client(api_key=api_key)

          model_name = os.environ.get('GEMINI_MODEL', 'gemini-3.5-flash')
          issue_title = os.environ.get('ISSUE_TITLE', '')
          issue_body = os.environ.get('ISSUE_BODY', '')

          prompt = f"""あなたは優秀なソフトウェアエンジニアです。
          以下のIssueの指示に従ってコードを作成または修正してください。

          【タイトル】: {issue_title}
          【内容】: {issue_body}

          回答は必ず修正後の完全なファイル内容だけを、以下の形式（コードブロック）で出力してください。
          
http://googleusercontent.com/immersive_entry_chip/0
          """

          print(f'Using model: {model_name}')
          response = client.models.generate_content(model=model_name, contents=prompt)
          res_text = response.text
          print('--- Gemini Output ---')
          print(res_text)

          pattern = r'
http://googleusercontent.com/immersive_entry_chip/1

---

## 修正の根拠

* 変更点: `git checkout -b $BRANCH_NAME || git checkout $BRANCH_NAME` の条件分岐を **`git checkout -B $BRANCH_NAME`** の一括コマンドへ変更しました。
* `-B` オプションを使用することで、「ブランチが存在しなければ新規作成、存在すれば強制上書き切り替え」を安全に行えるため、変数の誤解釈による Git エラーを根本的に防止できます。

---

## 合わせてご確認ください（新規リポジトリで必須の設定）

新しいリポジトリ（`BoatCalc`）では、デフォルトで **GitHub Actions の Pull Request 作成権限が OFF** になっていることがあります。上記 YML を更新した後、以下を念のためご確認ください。

1. リポジトリの **「Settings」** ＞ 左メニュー **「Actions」** ＞ **「General」** を開く。
2. 下部の **Workflow permissions** で以下にチェックを入れ保存する。
   * **Read and write permissions**
   * **Allow GitHub Actions to create and approve pull requests**

上記を設定してコミット後、Issue を編集・保存すれば、正常に PR が立ち上がるようになります！
